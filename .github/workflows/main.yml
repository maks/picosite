name: Build on Push

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            output-name: picosite-linux
            dart-arch: x64
          - os: macOS-latest
            output-name: picosite-mac
            dart-arch: arm64
          - os: windows-latest
            output-name: picosite-windows.exe
            dart-arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          architecture: ${{ matrix.dart-arch }}

      - name: Show build environment
        run: |
          uname -m || true
          dart --version
          file "$(which dart)" || true

      - run: mkdir output
      - run: dart pub get
      - run: dart tools/setversion.dart
      - run: dart compile exe bin/picosite.dart -v -o output/${{ matrix.output-name }}

      - name: Ad-hoc sign macOS binary
        if: matrix.os == 'macOS-latest'
        run: codesign --sign - output/${{ matrix.output-name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output-name }}
          path: output
